<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✍️ بیوکده</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #05070d; --card: #0d1420; --border: #1a2942;
    --text: #e8eef7; --muted: #7a8ba3;
    --blue: #3b82f6; --blue-soft: #60a5fa; --cyan: #06b6d4;
  }
  body {
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 20px 16px 80px;
    line-height: 1.6; overflow-x: hidden;
  }
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

  .admin-btn {
    position: fixed; top: 16px; left: 16px;
    background: rgba(13,20,32,0.85); color: var(--blue-soft);
    border: 1px solid var(--blue); padding: 8px 16px;
    border-radius: 10px; font-size: 12px; font-weight: 700;
    text-decoration: none; display: flex; align-items: center; gap: 6px;
    transition: all 0.25s; z-index: 100; backdrop-filter: blur(10px);
  }
  .admin-btn:hover {
    background: var(--blue); color: #fff; transform: translateY(-2px);
  }

  header { text-align: center; padding: 40px 0 30px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
  header .logo {
    font-size: 64px; display: inline-block;
    animation: float 3.5s ease-in-out infinite;
    filter: drop-shadow(0 0 35px rgba(59,130,246,0.6));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-10px) rotate(2deg); }
  }
  header h1 {
    font-size: 38px; font-weight: 900; letter-spacing: 3px;
    margin-top: 12px;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(59,130,246,0.4));
  }
  header p { color: var(--muted); font-size: 14px; margin-top: 10px; }

  .nav-buttons {
    display: flex; gap: 10px; justify-content: center;
    margin-bottom: 30px; flex-wrap: wrap;
  }
  .btn {
    padding: 12px 24px; border-radius: 11px;
    text-decoration: none; font-size: 13px; font-weight: 700;
    border: 1px solid var(--border);
    background: rgba(13,20,32,0.85); color: var(--text);
    transition: all 0.25s; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 8px;
    backdrop-filter: blur(10px);
  }
  .btn:hover {
    border-color: var(--blue);
    background: rgba(59,130,246,0.1);
    transform: translateY(-2px);
  }
  .btn.primary {
    background: linear-gradient(135deg, var(--blue), var(--blue-soft));
    color: #fff; border-color: transparent;
    box-shadow: 0 8px 25px rgba(59,130,246,0.4);
  }
  .btn.primary:hover {
    box-shadow: 0 12px 35px rgba(59,130,246,0.6);
  }
  .btn svg { width: 16px; height: 16px; }

  .section-title {
    font-size: 12px; color: var(--muted);
    letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 16px; font-weight: 700;
  }

  .users-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .user-card {
    background: rgba(13,20,32,0.85);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 20px;
    text-decoration: none; color: var(--text);
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    animation: slideUp 0.5s ease both;
    position: relative; overflow: hidden;
    display: block;
  }
  .user-card::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--blue), transparent);
    opacity: 0.6; transition: opacity 0.3s;
  }
  .user-card:hover {
    border-color: rgba(59,130,246,0.6);
    transform: translateY(-4px);
    box-shadow: 0 15px 45px rgba(0,0,0,0.6), 0 0 40px rgba(59,130,246,0.15);
  }
  .user-card:hover::before { opacity: 1; }

  .user-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    margin-bottom: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; color: #fff;
    box-shadow: 0 8px 25px rgba(59,130,246,0.3);
    letter-spacing: 1px;
  }

  .user-name { font-size: 17px; font-weight: 800; margin-bottom: 4px; word-break: break-word; }
  .user-username { color: var(--blue-soft); font-size: 12px; margin-bottom: 8px; font-weight: 600; }
  .user-bio {
    color: var(--muted); font-size: 12px; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .user-stats {
    display: flex; gap: 14px; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted);
    align-items: center;
  }
  .user-stats svg { width: 13px; height: 13px; margin-left: 4px; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 72px; opacity: 0.3; margin-bottom: 14px; display: block; }

  .info-box {
    background: rgba(13,20,32,0.6);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
    margin-top: 30px; text-align: center;
  }
  .info-box h3 { color: var(--blue-soft); font-size: 14px; margin-bottom: 10px; letter-spacing: 1px; }
  .info-box p { color: var(--muted); font-size: 12px; line-height: 1.8; }

  .footer {
    text-align: center; color: var(--muted);
    font-size: 11px; margin-top: 40px;
    padding-top: 20px; border-top: 1px solid var(--border);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>
<a href="/admin.html" class="admin-btn">🔐 ادمین</a>

<div class="container">
  <header>
    <div class="logo">✍️</div>
    <h1>بیوکده</h1>
    <p>صفحه شخصی خودت رو بساز و لینکت رو به همه بده</p>
  </header>

  <div class="nav-buttons">
    <a href="/create.html" class="btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      ساخت وبلاگ جدید
    </a>
    <a href="/dashboard.html" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      وبلاگ‌های من
    </a>
  </div>

  <div class="section-title">🔥 وبلاگ‌های فعال</div>
  <div class="users-grid" id="blogs">
    <div class="empty" style="grid-column: 1/-1;"><div class="icon">⏳</div><p>در حال بارگذاری...</p></div>
  </div>

  <div class="info-box">
    <h3>🎁 کاملاً رایگان</h3>
    <p>هر مرورگر می‌تونه تا <b style="color:var(--blue-soft)">۵ وبلاگ جداگانه</b> بسازه — بدون ثبت‌نام، بدون ایمیل، بدون رمز.</p>
  </div>

  <div class="footer">ساخته شده با ❤️ — بیوکده</div>
</div>

<script>
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [], w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const COUNT = window.innerWidth < 600 ? 25 : 55;
  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random()*w, y: Math.random()*h,
      r: Math.random()*1.8+0.4,
      vx: (Math.random()-0.5)*0.25,
      vy: (Math.random()-0.5)*0.25,
      alpha: Math.random()*0.5+0.2,
      pulse: Math.random()*Math.PI*2,
      hue: Math.random() > 0.5 ? 217 : 190
    });
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      const glow = Math.sin(p.pulse) * 0.3 + 0.7;
      const alpha = p.alpha * glow;
      const color = p.hue === 217 ? '59, 130, 246' : '6, 182, 212';
      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 7);
      gradient.addColorStop(0, `rgba(${color}, ${alpha})`);
      gradient.addColorStop(1, `rgba(${color}, 0)`);
      ctx.fillStyle = gradient;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(${color}, ${alpha})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 120) {
          ctx.strokeStyle = `rgba(59, 130, 246, ${(1 - dist/120) * 0.12})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

const GRADIENTS = {
  gradient1: 'linear-gradient(135deg, #3b82f6, #06b6d4)',
  gradient2: 'linear-gradient(135deg, #8b5cf6, #ec4899)',
  gradient3: 'linear-gradient(135deg, #f59e0b, #ef4444)',
  gradient4: 'linear-gradient(135deg, #10b981, #06b6d4)',
  gradient5: 'linear-gradient(135deg, #6366f1, #8b5cf6)',
  gradient6: 'linear-gradient(135deg, #ef4444, #f97316)'
};

const SVG_ICONS = {
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
};

function getInitials(name) {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

async function loadBlogs() {
  try {
    const res = await fetch('/api/blogs');
    const blogs = await res.json();
    const c = document.getElementById('blogs');

    if (!blogs.length) {
      c.innerHTML = '<div class="empty" style="grid-column: 1/-1;"><span class="icon">✨</span><p>هنوز کسی وبلاگ نساخته. اولین نفر باش!</p></div>';
      return;
    }

    c.innerHTML = blogs.map((b, i) => {
      const gradient = GRADIENTS[b.avatarStyle] || GRADIENTS.gradient1;
      return `
        <a href="/u/${b.username}" class="user-card" style="animation-delay: ${i * 0.05}s">
          <div class="user-avatar" style="background: ${gradient}">${getInitials(b.name || b.username)}</div>
          <div class="user-name">${escapeHtml(b.name || b.username)}</div>
          <div class="user-username">@${escapeHtml(b.username)}</div>
          ${b.bio ? `<div class="user-bio">${escapeHtml(b.bio)}</div>` : ''}
          <div class="user-stats">
            <span>${SVG_ICONS.link} ${b.linksCount}</span>
            <span>${SVG_ICONS.eye} ${b.views}</span>
          </div>
        </a>
      `;
    }).join('');
  } catch (e) {
    document.getElementById('blogs').innerHTML = '<div class="empty" style="grid-column: 1/-1;">خطا در بارگذاری</div>';
  }
}

loadBlogs();
</script>
</body>
</html>
