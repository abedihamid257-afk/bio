<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>در حال بارگذاری... — بیوکده</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #05070d; --card: #0d1420; --border: #1a2942;
    --text: #e8eef7; --muted: #7a8ba3;
    --blue: #3b82f6; --blue-soft: #60a5fa; --cyan: #06b6d4;
    --danger: #ef4444;
  }
  body {
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 40px 16px 80px;
    line-height: 1.7; overflow-x: hidden;
  }
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .container { max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }

  .profile { text-align: center; padding: 20px 20px 30px; animation: slideUp 0.6s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  .avatar {
    width: 110px; height: 110px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 42px; font-weight: 900; color: #fff;
    box-shadow: 0 12px 40px rgba(59,130,246,0.4);
    margin-bottom: 16px; letter-spacing: 2px;
    animation: float 3.5s ease-in-out infinite;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .name {
    font-size: 26px; font-weight: 900; margin-bottom: 6px;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .title { color: var(--muted); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; }
  .bio { color: #c0c0c0; font-size: 14px; max-width: 420px; margin: 0 auto; line-height: 1.8; }

  .about-section {
    background: rgba(13,20,32,0.85); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px; margin-bottom: 20px;
    backdrop-filter: blur(10px); animation: slideUp 0.6s ease 0.1s both;
    position: relative; overflow: hidden;
  }
  .about-section::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--blue), transparent);
    opacity: 0.6;
  }
  .about-section h2 {
    color: var(--blue-soft); font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 12px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .about-section h2 svg { width: 16px; height: 16px; }
  .about-section p { color: #c0c0c0; font-size: 14px; line-height: 1.9; white-space: pre-wrap; word-break: break-word; }

  .footer {
    text-align: center; color: var(--muted); font-size: 11px;
    margin-top: 40px; padding-top: 20px;
    border-top: 1px solid var(--border); letter-spacing: 1px;
  }
  .footer a { color: var(--blue-soft); text-decoration: none; font-weight: 700; }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }

  .error-page { text-align: center; padding: 80px 20px; }
  .error-page .icon { font-size: 80px; margin-bottom: 20px; display: block; filter: drop-shadow(0 0 30px rgba(239,68,68,0.5)); }
  .error-page h1 { color: var(--danger); font-size: 28px; margin-bottom: 12px; }
  .error-page p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .error-page a {
    display: inline-block; padding: 12px 24px;
    background: linear-gradient(135deg, var(--blue), var(--blue-soft));
    color: #fff; text-decoration: none; border-radius: 10px;
    font-weight: 700; font-size: 13px;
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="container" id="app">
  <div class="empty">⏳ در حال بارگذاری...</div>
</div>

<script>
// ذرات
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [], w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const COUNT = window.innerWidth < 600 ? 25 : 50;
  for (let i = 0; i < COUNT; i++) {
    particles.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.8+0.4, vx: (Math.random()-0.5)*0.25, vy: (Math.random()-0.5)*0.25, alpha: Math.random()*0.5+0.2, pulse: Math.random()*Math.PI*2, hue: Math.random() > 0.5 ? 217 : 190 });
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      const glow = Math.sin(p.pulse) * 0.3 + 0.7;
      const alpha = p.alpha * glow;
      const color = p.hue === 217 ? '59, 130, 246' : '6, 182, 212';
      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 7);
      gradient.addColorStop(0, `rgba(${color}, ${alpha})`);
      gradient.addColorStop(1, `rgba(${color}, 0)`);
      ctx.fillStyle = gradient;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(${color}, ${alpha})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

const GRADIENTS = {
  gradient1: 'linear-gradient(135deg, #3b82f6, #06b6d4)',
  gradient2: 'linear-gradient(135deg, #8b5cf6, #ec4899)',
  gradient3: 'linear-gradient(135deg, #f59e0b, #ef4444)',
  gradient4: 'linear-gradient(135deg, #10b981, #06b6d4)',
  gradient5: 'linear-gradient(135deg, #6366f1, #8b5cf6)',
  gradient6: 'linear-gradient(135deg, #ef4444, #f97316)'
};

const SVG_USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function getInitials(name) {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}

function getUsername() {
  const p = window.location.pathname.split('/');
  return p[p.length - 1];
}

async function load() {
  const username = getUsername();
  const app = document.getElementById('app');
  if (!username) {
    app.innerHTML = '<div class="error-page"><span class="icon">❌</span><h1>پیدا نشد</h1><a href="/">بازگشت</a></div>';
    return;
  }

  try {
    const res = await fetch('/api/blog/' + encodeURIComponent(username));
    const user = await res.json();
    if (!res.ok) {
      app.innerHTML = `<div class="error-page"><span class="icon">🚫</span><h1>${res.status === 403 ? 'مسدود شده' : 'پیدا نشد'}</h1><p>${escapeHtml(user.error || '')}</p><a href="/">بازگشت به خانه</a></div>`;
      return;
    }

    document.title = (user.name || user.username) + ' — بیوکده';
    const gradient = GRADIENTS[user.avatarStyle] || GRADIENTS.gradient1;

    let aboutHtml = '';
    if (user.about && user.about.trim()) {
      aboutHtml = `
        <div class="about-section">
          <h2>${SVG_USER} درباره من</h2>
          <p>${escapeHtml(user.about)}</p>
        </div>`;
    }

    app.innerHTML = `
      <div class="profile">
        <div class="avatar" style="background:${gradient}">${getInitials(user.name || user.username)}</div>
        <h1 class="name">${escapeHtml(user.name || user.username)}</h1>
        ${user.title ? `<p class="title">${escapeHtml(user.title)}</p>` : ''}
        ${user.bio ? `<p class="bio">${escapeHtml(user.bio)}</p>` : ''}
      </div>
      ${aboutHtml}
      <div class="footer">ساخته شده با ❤️ در <a href="/">بیوکده</a></div>
    `;
  } catch (e) {
    app.innerHTML = '<div class="error-page"><span class="icon">❌</span><h1>خطا</h1><a href="/">بازگشت</a></div>';
  }
}

load();
</script>
</body>
</html>
