<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 پنل ادمین — بیوکده</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #05070d; --card: #0d1420; --border: #1a2942;
    --text: #e8eef7; --muted: #7a8ba3;
    --blue: #3b82f6; --blue-soft: #60a5fa; --cyan: #06b6d4;
    --danger: #ef4444; --success: #22c55e;
  }
  body {
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 20px 16px 60px; line-height: 1.6;
  }
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .container { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; }

  #lockScreen {
    position: fixed; inset: 0; z-index: 500;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; background: var(--bg);
  }
  #lockScreen.hidden { display: none; }
  .lock-box {
    background: rgba(13,20,32,0.9); border: 1px solid var(--border);
    border-radius: 18px; padding: 40px 30px;
    max-width: 400px; width: 100%; text-align: center;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: slideUp 0.5s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  .lock-box .icon { font-size: 64px; display: block; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .lock-box h2 {
    font-size: 22px; font-weight: 800; margin-bottom: 20px;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .lock-box input {
    width: 100%; padding: 14px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(5,7,13,0.8);
    color: var(--text); font-size: 15px; text-align: center;
    letter-spacing: 4px; font-family: inherit;
  }
  .lock-box input:focus { outline: none; border-color: var(--blue); }
  .lock-box button {
    background: linear-gradient(135deg, var(--blue), var(--blue-soft));
    color: #fff; border: none; padding: 14px 22px;
    border-radius: 10px; cursor: pointer; font-size: 15px;
    font-weight: 800; font-family: inherit; width: 100%; margin-top: 16px;
  }
  .lock-error {
    margin-top: 14px; padding: 10px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    background: rgba(239,68,68,0.1); color: #f87171;
    border: 1px solid rgba(239,68,68,0.3); display: none;
  }
  .lock-error.show { display: block; }

  #adminPanel { display: none; }
  #adminPanel.show { display: block; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; background: rgba(13,20,32,0.85);
    border: 1px solid var(--border); border-radius: 14px;
    margin-bottom: 20px; backdrop-filter: blur(10px);
    flex-wrap: wrap; gap: 10px;
  }
  .topbar h1 {
    font-size: 18px; font-weight: 800;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .topbar .actions { display: flex; gap: 8px; }
  .btn {
    padding: 8px 14px; border-radius: 9px; cursor: pointer;
    font-size: 12px; font-weight: 700; font-family: inherit;
    border: 1px solid var(--border);
    background: rgba(5,7,13,0.6); color: var(--text);
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.25s;
  }
  .btn:hover { border-color: var(--blue); background: rgba(59,130,246,0.1); }
  .btn.danger { color: var(--danger); border-color: rgba(239,68,68,0.3); }
  .btn.danger:hover { background: var(--danger); color: #fff; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .stat {
    background: rgba(13,20,32,0.85); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; text-align: center;
  }
  .stat .val { font-size: 24px; font-weight: 800; color: var(--blue-soft); }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; }

  .card {
    background: rgba(13,20,32,0.85); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }
  .card h2 { font-size: 15px; font-weight: 800; margin-bottom: 16px; color: var(--blue-soft); }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    background: rgba(5,7,13,0.8); padding: 4px;
    border-radius: 10px; border: 1px solid var(--border);
  }
  .tab {
    flex: 1; padding: 10px; text-align: center; cursor: pointer;
    border-radius: 7px; color: var(--muted); font-size: 12px;
    font-weight: 600; transition: all 0.25s;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--blue), var(--blue-soft));
    color: #fff;
  }

  .search-box { margin-bottom: 14px; }
  .search-box input {
    width: 100%; padding: 11px 14px; border-radius: 9px;
    border: 1px solid var(--border); background: rgba(5,7,13,0.8);
    color: var(--text); font-size: 13px; font-family: inherit;
  }
  .search-box input:focus { outline: none; border-color: var(--blue); }

  .item-row {
    background: rgba(5,7,13,0.5); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
    transition: all 0.25s; flex-wrap: wrap;
  }
  .item-row:hover { border-color: rgba(59,130,246,0.4); }
  .item-row.banned { background: rgba(239,68,68,0.06); border-color: rgba(239,68,68,0.3); opacity: 0.85; }

  .item-row .info { flex: 1; min-width: 150px; }
  .item-row .info .t { font-size: 13px; font-weight: 700; margin-bottom: 3px; word-break: break-word; }
  .item-row .info .s { font-size: 11px; color: var(--muted); word-break: break-all; }
  .item-row .url {
    font-family: 'Consolas', monospace; font-size: 11px;
    color: var(--muted); direction: ltr; text-align: left;
    background: rgba(0,0,0,0.3); padding: 5px 10px;
    border-radius: 6px; word-break: break-all; width: 100%;
  }
  .item-row .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .item-row button {
    padding: 6px 12px; border-radius: 7px; font-size: 11px;
    font-weight: 700; cursor: pointer; font-family: inherit;
    border: none; transition: all 0.25s;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .item-row button.ban { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
  .item-row button.ban:hover { background: var(--danger); color: #fff; }
  .item-row button.unban { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
  .item-row button.unban:hover { background: var(--success); color: #fff; }
  .item-row button.del { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
  .item-row button.del:hover { background: var(--danger); color: #fff; }
  .item-row button.view { background: rgba(59,130,246,0.15); color: var(--blue-soft); border: 1px solid rgba(59,130,246,0.3); text-decoration: none; }
  .item-row button.view:hover { background: var(--blue); color: #fff; }

  .banned-badge { background: var(--danger); color: #fff; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 700; }
  .empty { text-align: center; padding: 30px; color: var(--muted); font-size: 13px; }
  .msg { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 12px; display: none; text-align: center; font-weight: 600; }
  .msg.success { background: rgba(34,197,94,0.1); color: var(--success); display: block; }
  .msg.error { background: rgba(239,68,68,0.1); color: #f87171; display: block; }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div id="lockScreen">
  <div class="lock-box">
    <span class="icon">🔐</span>
    <h2>ورود ادمین</h2>
    <input type="password" id="lockInput" placeholder="• • • •" maxlength="20" inputmode="numeric">
    <button onclick="tryUnlock()">🔓 ورود</button>
    <div class="lock-error" id="lockError">❌ رمز اشتباه</div>
  </div>
</div>

<div id="adminPanel">
  <div class="container">
    <div class="topbar">
      <h1>🔐 پنل ادمین</h1>
      <div class="actions">
        <a href="/" class="btn">🏠 سایت</a>
        <button class="btn danger" onclick="logout()">🚪 خروج</button>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="card">
      <h2>➕ بن کردن لینک دستی</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input type="text" id="banUrl" placeholder="https://example.com/page"
               style="flex:1;min-width:200px;padding:11px 14px;border-radius:9px;border:1px solid var(--border);background:rgba(5,7,13,0.8);color:var(--text);font-size:13px;font-family:inherit;direction:ltr;">
        <button class="btn" onclick="banManual()" style="background:rgba(239,68,68,0.15);color:var(--danger);border-color:rgba(239,68,68,0.3);">🚫 بن کن</button>
      </div>
      <div class="msg" id="banMsg"></div>
    </div>

    <div class="card">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('users', this)">👥 کاربران</div>
        <div class="tab" onclick="switchTab('blogs', this)">📝 وبلاگ‌ها</div>
        <div class="tab" onclick="switchTab('links', this)">🔗 لینک‌ها</div>
        <div class="tab" onclick="switchTab('banned', this)">🚫 بن‌شده‌ها</div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 جستجو..." oninput="render()">
      </div>
      <div id="listContent"><div class="empty">در حال بارگذاری...</div></div>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [], w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  for (let i = 0; i < 35; i++) {
    particles.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.6+0.4, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, alpha: Math.random()*0.5+0.2, pulse: Math.random()*Math.PI*2 });
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      const glow = Math.sin(p.pulse) * 0.3 + 0.7;
      const alpha = p.alpha * glow;
      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
      gradient.addColorStop(0, `rgba(59, 130, 246, ${alpha})`);
      gradient.addColorStop(1, 'rgba(59, 130, 246, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(96, 165, 250, ${alpha})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

let adminPassword = sessionStorage.getItem('bioAdminPass') || '';
let usersData = [];
let blogsData = [];
let linksData = [];
let bannedData = [];
let currentTab = 'users';

if (adminPassword) showPanel();

async function tryUnlock() {
  const pass = document.getElementById('lockInput').value.trim();
  if (!pass) return showLockError('رمز را وارد کن');
  try {
    const res = await fetch('/api/admin/users', { headers: { 'x-admin-password': pass } });
    if (res.status === 401) throw new Error();
    adminPassword = pass;
    sessionStorage.setItem('bioAdminPass', pass);
    showPanel();
  } catch (e) {
    showLockError('رمز اشتباه');
    document.getElementById('lockInput').value = '';
  }
}

function showLockError(t) {
  const e = document.getElementById('lockError');
  e.textContent = '❌ ' + t;
  e.classList.add('show');
  setTimeout(() => e.classList.remove('show'), 3000);
}

function showPanel() {
  document.getElementById('lockScreen').classList.add('hidden');
  document.getElementById('adminPanel').classList.add('show');
  loadAll();
}

function logout() {
  if (!confirm('خارج می‌شی؟')) return;
  sessionStorage.removeItem('bioAdminPass');
  adminPassword = '';
  location.reload();
}

document.getElementById('lockInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tryUnlock();
});

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentTab = name;
  render();
}

async function loadAll() {
  try {
    const headers = { 'x-admin-password': adminPassword };
    const [uRes, bRes, lRes, banRes] = await Promise.all([
      fetch('/api/admin/users', { headers }),
      fetch('/api/admin/blogs', { headers }),
      fetch('/api/admin/links', { headers }),
      fetch('/api/admin/banned-links', { headers })
    ]);
    if (uRes.status === 401) { logout(); return; }
    usersData = await uRes.json();
    blogsData = await bRes.json();
    linksData = await lRes.json();
    bannedData = await banRes.json();
    updateStats();
    render();
  } catch (e) {
    document.getElementById('listContent').innerHTML = '<div class="empty">خطا</div>';
  }
}

function updateStats() {
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat"><div class="val">${usersData.length}</div><div class="lbl">کاربر</div></div>
    <div class="stat"><div class="val">${blogsData.length}</div><div class="lbl">وبلاگ</div></div>
    <div class="stat"><div class="val">${linksData.length}</div><div class="lbl">لینک</div></div>
    <div class="stat"><div class="val">${bannedData.length}</div><div class="lbl">لینک بن‌شده</div></div>
  `;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function render() {
  const c = document.getElementById('listContent');
  const search = (document.getElementById('searchInput').value || '').toLowerCase();

  if (currentTab === 'users') {
    let list = usersData;
    if (search) list = list.filter(u => u.username.toLowerCase().includes(search) || (u.name || '').toLowerCase().includes(search));
    if (!list.length) { c.innerHTML = '<div class="empty">کاربری پیدا نشد</div>'; return; }
    c.innerHTML = list.map(u => `
      <div class="item-row ${u.banned ? 'banned' : ''}">
        <div class="info">
          <div class="t">👤 ${escapeHtml(u.name || u.username)} ${u.banned ? '<span class="banned-badge">بن</span>' : ''}</div>
          <div class="s">@${escapeHtml(u.username)} • ${u.blogsCount} وبلاگ</div>
        </div>
        <div class="actions">
          ${u.banned
            ? `<button class="unban" onclick="unbanUser('${escapeHtml(u.username)}')">✓ آنبن</button>`
            : `<button class="ban" onclick="banUser('${escapeHtml(u.username)}')">🚫 بن</button>`
          }
          <button class="del" onclick="deleteUser('${escapeHtml(u.username)}')">🗑 حذف</button>
        </div>
      </div>
    `).join('');
  } else if (currentTab === 'blogs') {
    let list = blogsData;
    if (search) list = list.filter(b => b.username.toLowerCase().includes(search) || b.owner.toLowerCase().includes(search));
    if (!list.length) { c.innerHTML = '<div class="empty">وبلاگی پیدا نشد</div>'; return; }
    c.innerHTML = list.map(b => `
      <div class="item-row ${b.banned ? 'banned' : ''}">
        <div class="info">
          <div class="t">📝 ${escapeHtml(b.name || b.username)} ${b.banned ? '<span class="banned-badge">بن</span>' : ''}</div>
          <div class="s">/u/${escapeHtml(b.username)} • مالک: @${escapeHtml(b.owner)} • ${b.linksCount} لینک • ${b.views} بازدید</div>
        </div>
        <div class="actions">
          <a href="/u/${escapeHtml(b.username)}" target="_blank" class="btn view">👁</a>
          ${b.banned
            ? `<button class="unban" onclick="unbanBlog('${escapeHtml(b.id)}')">✓ آنبن</button>`
            : `<button class="ban" onclick="banBlog('${escapeHtml(b.id)}')">🚫 بن</button>`
          }
          <button class="del" onclick="deleteBlog('${escapeHtml(b.id)}')">🗑</button>
        </div>
      </div>
    `).join('');
  } else if (currentTab === 'links') {
    let list = linksData;
    if (search) list = list.filter(l => l.title.toLowerCase().includes(search) || l.url.toLowerCase().includes(search) || l.blogUsername.toLowerCase().includes(search));
    if (!list.length) { c.innerHTML = '<div class="empty">لینکی پیدا نشد</div>'; return; }
    c.innerHTML = list.map(l => `
      <div class="item-row ${l.banned ? 'banned' : ''}">
        <div class="info">
          <div class="t">🔗 ${escapeHtml(l.title)} ${l.banned ? '<span class="banned-badge">بن</span>' : ''}</div>
          <div class="s">از /u/${escapeHtml(l.blogUsername)} • مالک: @${escapeHtml(l.owner)} • ${l.clicks} کلیک</div>
        </div>
        <div class="url">${escapeHtml(l.url)}</div>
        <div class="actions">
          ${l.banned
            ? `<button class="unban" onclick="unbanLink('${encodeURIComponent(l.url)}')">✓ آنبن</button>`
            : `<button class="ban" onclick="banLink('${encodeURIComponent(l.url)}')">🚫 بن</button>`
          }
          <button class="del" onclick="deleteLink('${escapeHtml(l.blogId)}', '${escapeHtml(l.linkId)}')">🗑</button>
        </div>
      </div>
    `).join('');
  } else {
    if (!bannedData.length) { c.innerHTML = '<div class="empty">لینک بن‌شده‌ای نیست</div>'; return; }
    c.innerHTML = bannedData.map(u => `
      <div class="item-row banned">
        <div class="info" style="flex:1;">
          <div class="url">${escapeHtml(u)}</div>
        </div>
        <div class="actions">
          <button class="unban" onclick="unbanLink('${encodeURIComponent(u)}')">✓ آنبن</button>
        </div>
      </div>
    `).join('');
  }
}

async function apiAdmin(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
    body: body ? JSON.stringify(body) : undefined
  });
  return res;
}

async function banUser(u) { if (!confirm('کاربر @' + u + ' بن بشه؟')) return; await apiAdmin('/api/admin/ban-user', { username: u }); loadAll(); }
async function unbanUser(u) { await apiAdmin('/api/admin/unban-user', { username: u }); loadAll(); }
async function deleteUser(u) { if (!confirm('کاربر @' + u + ' و همه وبلاگ‌هاش حذف بشن؟')) return; await apiAdmin('/api/admin/delete-user', { username: u }); loadAll(); }
async function banBlog(id) { if (!confirm('وبلاگ بن بشه؟')) return; await apiAdmin('/api/admin/ban-blog', { id }); loadAll(); }
async function unbanBlog(id) { await apiAdmin('/api/admin/unban-blog', { id }); loadAll(); }
async function deleteBlog(id) { if (!confirm('وبلاگ حذف بشه؟')) return; await apiAdmin('/api/admin/delete-blog', { id }); loadAll(); }
async function banLink(urlEnc) { const url = decodeURIComponent(urlEnc); if (!confirm('لینک بن بشه؟')) return; await apiAdmin('/api/admin/ban-link', { url }); loadAll(); }
async function unbanLink(urlEnc) { const url = decodeURIComponent(urlEnc); await apiAdmin('/api/admin/unban-link', { url }); loadAll(); }
async function deleteLink(blogId, linkId) { if (!confirm('لینک حذف بشه؟')) return; await apiAdmin('/api/admin/delete-link', { blogId, linkId }); loadAll(); }

async function banManual() {
  const url = document.getElementById('banUrl').value.trim();
  if (!url) return showMsg('banMsg', 'لینک رو وارد کن', true);
  await apiAdmin('/api/admin/ban-link', { url });
  document.getElementById('banUrl').value = '';
  showMsg('banMsg', '🚫 بن شد', false);
  loadAll();
}

function showMsg(id, text, isError) {
  const m = document.getElementById(id);
  m.textContent = text;
  m.className = 'msg ' + (isError ? 'error' : 'success');
  setTimeout(() => { m.className = 'msg'; }, 3000);
}
</script>
</body>
</html>
