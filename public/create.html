<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ ساخت وبلاگ — بیوکده</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #05070d; --card: #0d1420; --border: #1a2942;
    --text: #e8eef7; --muted: #7a8ba3;
    --blue: #3b82f6; --blue-soft: #60a5fa; --cyan: #06b6d4;
    --danger: #ef4444; --success: #22c55e;
  }
  body {
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 30px 16px 80px;
    line-height: 1.6; overflow-x: hidden;
  }
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .container { max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }

  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); text-decoration: none;
    font-size: 13px; margin-bottom: 20px;
    transition: color 0.25s;
  }
  .back-btn:hover { color: var(--blue-soft); }

  .card {
    background: rgba(13,20,32,0.9);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 35px 28px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: slideUp 0.5s ease;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, var(--blue), transparent);
    opacity: 0.7;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h1 {
    text-align: center; font-size: 26px; font-weight: 900;
    letter-spacing: 2px; margin-bottom: 6px;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 26px; }

  .field { margin-bottom: 16px; }
  label {
    display: block; margin-bottom: 6px;
    font-size: 11px; color: var(--blue-soft);
    letter-spacing: 1px; text-transform: uppercase; font-weight: 700;
  }
  input, textarea {
    width: 100%; padding: 12px 15px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(5,7,13,0.8);
    color: var(--text); font-size: 14px; font-family: inherit;
    transition: all 0.25s;
  }
  input:focus, textarea:focus {
    outline: none; border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
  }
  textarea { min-height: 100px; resize: vertical; line-height: 1.7; }
  .hint { font-size: 10px; color: var(--muted); margin-top: 4px; }

  .avatar-options {
    display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px;
  }
  .avatar-opt {
    width: 52px; height: 52px; border-radius: 50%;
    cursor: pointer; border: 3px solid transparent;
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: 18px;
  }
  .avatar-opt:hover { transform: scale(1.1); }
  .avatar-opt.selected {
    border-color: var(--cyan);
    box-shadow: 0 0 20px rgba(6,182,212,0.6);
    transform: scale(1.1);
  }

  button.submit {
    width: 100%; padding: 14px; border-radius: 11px;
    border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--blue), var(--blue-soft));
    color: #fff; font-size: 15px; font-weight: 800;
    font-family: inherit; margin-top: 20px;
    transition: all 0.25s;
    box-shadow: 0 8px 25px rgba(59,130,246,0.4);
  }
  button.submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 35px rgba(59,130,246,0.6);
  }
  button.submit:disabled { opacity: 0.5; cursor: wait; }

  .msg {
    margin-top: 16px; padding: 13px; border-radius: 10px;
    font-size: 13px; display: none; text-align: center; font-weight: 600;
  }
  .msg.error {
    background: rgba(239,68,68,0.1); color: #f87171;
    border: 1px solid rgba(239,68,68,0.3); display: block;
  }

  .success-box {
    display: none; text-align: center; padding: 20px 0;
  }
  .success-box.show { display: block; animation: slideUp 0.5s ease; }
  .success-box .icon {
    font-size: 60px; margin-bottom: 16px; display: block;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(34,197,94,0.6));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .success-box h2 {
    color: var(--success); font-size: 22px; margin-bottom: 10px;
  }
  .url-box {
    background: rgba(5,7,13,0.8); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin: 16px 0;
    font-family: 'Consolas', monospace; font-size: 12px;
    direction: ltr; word-break: break-all; color: var(--cyan);
  }
  .key-box {
    background: rgba(250,204,21,0.08); border: 1px solid rgba(250,204,21,0.3);
    border-radius: 10px; padding: 14px; margin: 16px 0;
    font-family: 'Consolas', monospace; font-size: 12px;
    direction: ltr; word-break: break-all; color: #fde047;
  }
  .key-box small {
    display: block; color: var(--muted); font-size: 11px;
    font-family: inherit; margin-bottom: 6px; direction: rtl;
  }
  .copy-btn {
    background: rgba(59,130,246,0.15); color: var(--blue-soft);
    border: 1px solid rgba(59,130,246,0.3);
    padding: 10px 18px; border-radius: 9px; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 13px;
    transition: all 0.25s; margin: 4px;
  }
  .copy-btn:hover {
    background: var(--blue); color: #fff;
  }
  .copy-btn.copied { background: var(--success); color: #fff; border-color: var(--success); }
  .copy-btn.link-btn {
    display: inline-block; text-decoration: none;
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container">
  <a href="/" class="back-btn">← بازگشت</a>

  <div class="card">
    <div id="formBox">
      <h1>✨ ساخت وبلاگ</h1>
      <p class="subtitle">رایگان، بدون ثبت‌نام</p>

      <div class="field">
        <label>نام کاربری (آدرس وبلاگت)</label>
        <input type="text" id="username" placeholder="ali_reza" maxlength="20">
        <div class="hint">حروف کوچک انگلیسی، عدد و _ — بین ۳ تا ۲۰ کاراکتر</div>
      </div>

      <div class="field">
        <label>نام نمایشی</label>
        <input type="text" id="name" placeholder="علی رضایی" maxlength="50">
      </div>

      <div class="field">
        <label>عنوان شغلی</label>
        <input type="text" id="title" placeholder="برنامه‌نویس، طراح، ..." maxlength="100">
      </div>

      <div class="field">
        <label>بیوگرافی کوتاه</label>
        <input type="text" id="bio" placeholder="یه جمله درباره خودت" maxlength="300">
      </div>

      <div class="field">
        <label>درباره من (اختیاری)</label>
        <textarea id="about" placeholder="متن بلندتر درباره خودت..." maxlength="5000"></textarea>
      </div>

      <div class="field">
        <label>رنگ آواتار</label>
        <div class="avatar-options" id="avatarOpts"></div>
      </div>

      <button class="submit" id="submitBtn" onclick="doCreate()">✨ ساخت وبلاگ</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="success-box" id="successBox">
      <span class="icon">🎉</span>
      <h2>وبلاگت ساخته شد!</h2>
      <p style="color:var(--muted);font-size:13px;">لینک و کلید ویرایش رو یه جای امن ذخیره کن</p>

      <div class="url-box" id="urlBox"></div>
      <button class="copy-btn" onclick="copyUrl(this)">📋 کپی لینک</button>

      <div class="key-box" id="keyBox"></div>
      <button class="copy-btn" onclick="copyKey(this)">🔑 کپی کلید ویرایش</button>

      <p style="color:var(--danger);font-size:12px;margin-top:16px;">
        ⚠️ کلید ویرایش رو گم نکن! بدون اون نمی‌تونی وبلاگت رو ویرایش کنی
      </p>

      <div style="margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
        <a href="#" id="viewLink" class="copy-btn link-btn">👁 مشاهده وبلاگ</a>
        <a href="/" class="copy-btn link-btn">🏠 صفحه اصلی</a>
      </div>
    </div>
  </div>
</div>

<script>
// ============ ذرات ============
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [], w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  for (let i = 0; i < 30; i++) {
    particles.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.5+0.4, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, alpha: Math.random()*0.5+0.2, pulse: Math.random()*Math.PI*2 });
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      const glow = Math.sin(p.pulse) * 0.3 + 0.7;
      const alpha = p.alpha * glow;
      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
      gradient.addColorStop(0, `rgba(59, 130, 246, ${alpha})`);
      gradient.addColorStop(1, 'rgba(59, 130, 246, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(96, 165, 250, ${alpha})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

const GRADIENTS = {
  gradient1: 'linear-gradient(135deg, #3b82f6, #06b6d4)',
  gradient2: 'linear-gradient(135deg, #8b5cf6, #ec4899)',
  gradient3: 'linear-gradient(135deg, #f59e0b, #ef4444)',
  gradient4: 'linear-gradient(135deg, #10b981, #06b6d4)',
  gradient5: 'linear-gradient(135deg, #6366f1, #8b5cf6)',
  gradient6: 'linear-gradient(135deg, #ef4444, #f97316)'
};

let selectedAvatar = 'gradient1';

function renderAvatars() {
  const c = document.getElementById('avatarOpts');
  c.innerHTML = Object.entries(GRADIENTS).map(([key, val]) => `
    <div class="avatar-opt ${key === selectedAvatar ? 'selected' : ''}"
         style="background: ${val}"
         onclick="selectAvatar('${key}')">${key === selectedAvatar ? '✓' : ''}</div>
  `).join('');
}

function selectAvatar(key) {
  selectedAvatar = key;
  renderAvatars();
}

renderAvatars();

function showMsg(text, isError) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + (isError ? 'error' : '');
}

async function doCreate() {
  const username = document.getElementById('username').value.trim().toLowerCase();
  const name = document.getElementById('name').value.trim();
  const title = document.getElementById('title').value.trim();
  const bio = document.getElementById('bio').value.trim();
  const about = document.getElementById('about').value.trim();

  if (!username) return showMsg('نام کاربری رو وارد کن', true);
  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    return showMsg('نام کاربری: ۳-۲۰ کاراکتر، حروف کوچک، عدد، _', true);
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ در حال ساخت...';

  try {
    const res = await fetch('/api/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, name, title, bio, about, avatarStyle: selectedAvatar })
    });
    const data = await res.json();

    if (!res.ok) {
      btn.disabled = false;
      btn.textContent = '✨ ساخت وبلاگ';
      return showMsg(data.error || 'خطا', true);
    }

    // ذخیره تو localStorage
    const keys = JSON.parse(localStorage.getItem('bioKadeKeys') || '[]');
    keys.push({ username: data.username, key: data.editKey, at: new Date().toISOString() });
    localStorage.setItem('bioKadeKeys', JSON.stringify(keys));

    // نمایش موفقیت
    const url = window.location.origin + '/u/' + data.username;
    document.getElementById('urlBox').textContent = url;
    document.getElementById('keyBox').innerHTML = '<small>🔑 کلید ویرایش (محرمانه)</small>' + data.editKey;
    document.getElementById('viewLink').href = '/u/' + data.username;

    document.getElementById('formBox').style.display = 'none';
    document.getElementById('successBox').classList.add('show');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '✨ ساخت وبلاگ';
    showMsg('خطا در ارتباط', true);
  }
}

function copyUrl(btn) {
  const url = document.getElementById('urlBox').textContent;
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = '✅ کپی شد';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 کپی لینک'; btn.classList.remove('copied'); }, 2000);
  });
}

function copyKey(btn) {
  const el = document.getElementById('keyBox');
  const key = el.textContent.replace('🔑 کلید ویرایش (محرمانه)', '').trim();
  navigator.clipboard.writeText(key).then(() => {
    btn.textContent = '✅ کپی شد';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '🔑 کپی کلید ویرایش'; btn.classList.remove('copied'); }, 2000);
  });
}
</script>
</body>
</html>
